services:
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: defpro-fuseki
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
      JVM_ARGS: "-Xmx2g -Xms1g"
    volumes:
      - fuseki-data:/fuseki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-server:
    build: ./mcp-server
    container_name: defpro-mcp
    ports:
      - "8080:8080"
    depends_on:
      fuseki:
        condition: service_healthy
    environment:
      FUSEKI_ENDPOINT: http://fuseki:3030/procurement
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    container_name: defpro-dashboard
    ports:
      - "5173:80"
    depends_on:
      fuseki:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fuseki-data:
